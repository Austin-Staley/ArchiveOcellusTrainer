<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, user-scalable=no" />
    <title>Archive Ocellus Trainer</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
        background: black;
        color: white;
        font-family: sans-serif;
      }

      canvas {
        image-rendering: pixelated;
      }

      #credit_line {
        position: absolute;
        bottom: 4px;
        left: 4px;
        max-width: 60ch;
        margin: 0;
        font-size: 11px;
        text-shadow: 1px 1px 0 black;
        pointer-events: none;
      }

      #drill_controls {
        position: absolute;
        bottom: 48px;
        left: 4px;
        display: flex;
        gap: 4px;
        margin: 0;
        font-size: 12px;
      }

      #drill_controls button {
        padding: 2px 8px;
        border: 1px solid #000;
        background: #5a5245;
        color: #ff981f;
        font: inherit;
        cursor: pointer;
      }

      #settings_menu {
        border: 2px solid #000;
        outline: 1px solid #5a5245;
        background: #3e3529;
        color: #ff981f;
        text-shadow: 1px 1px 0 black;
        position: absolute;
        bottom: calc(100% + 4px);
        left: 0;
        display: grid;
        gap: 6px;
        justify-items: start;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        padding: 8px;
        white-space: nowrap;
      }

      #settings_menu[hidden] {
        display: none;
      }

      #seed {
        width: 10ch;
      }

      #game_chat {
        position: absolute;
        bottom: 84px;
        left: 4px;
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 14px;
        text-shadow: 1px 1px 0 black;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
